name: Publish mini app preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply the guest-facing reception contact
        env:
          BAIKAL_ADMIN_PHONE: ${{ vars.BAIKAL_ADMIN_PHONE }}
          BAIKAL_ADMIN_CHAT_URL: ${{ vars.BAIKAL_ADMIN_CHAT_URL }}
        run: |
          node -e 'const fs = require("node:fs"); const fallback = JSON.parse(fs.readFileSync("dist/hotel-contact.json", "utf8")); const p = process.env.BAIKAL_ADMIN_PHONE; const c = process.env.BAIKAL_ADMIN_CHAT_URL; const phone = /^\+7\d{10}$/.test(p ?? "") ? p : fallback.phone; const chatUrl = /^https:\/\/max\.ru\/u\/[A-Za-z0-9_-]+\/?$/.test(c ?? "") ? c : null; fs.writeFileSync("dist/hotel-contact.json", JSON.stringify({chatUrl, phone}) + "\n")'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
