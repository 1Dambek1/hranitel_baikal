name: Publish mini app preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply the public mini-app settings
        env:
          BAIKAL_ADMIN_PHONE: ${{ vars.BAIKAL_ADMIN_PHONE }}
          BAIKAL_ADMIN_CHAT_URL: ${{ vars.BAIKAL_ADMIN_CHAT_URL }}
          BAIKAL_API_ORIGIN: ${{ vars.BAIKAL_API_ORIGIN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const fallback = JSON.parse(fs.readFileSync('dist/hotel-contact.json', 'utf8'));
          const { BAIKAL_ADMIN_PHONE: p, BAIKAL_ADMIN_CHAT_URL: c } = process.env;
          const phone = /^\+7\d{10}$/.test(p ?? '') ? p : fallback.phone;
          const chatUrl = /^https:\/\/max\.ru\/u\/[A-Za-z0-9_-]+\/?$/.test(c ?? '') ? c : null;
          fs.writeFileSync('dist/hotel-contact.json', JSON.stringify({ chatUrl, phone }) + '\n');
          const page = fs.readFileSync('dist/index.html', 'utf8');
          const href = chatUrl ?? 'tel:' + phone;
          let availabilityUrl = '';
          if (process.env.BAIKAL_API_ORIGIN) {
            const api = new URL(process.env.BAIKAL_API_ORIGIN);
            if (api.protocol !== 'https:' || api.username || api.password || api.pathname !== '/' || api.search || api.hash) {
              throw new Error('BAIKAL_API_ORIGIN must be an HTTPS origin');
            }
            availabilityUrl = api.origin + '/api/availability';
          }
          fs.writeFileSync('dist/index.html', page
            .replaceAll('data-reception href="tel:+79953235878"', 'data-reception href="' + href + '"')
            .replace('name="baikal-availability-url" content=""', 'name="baikal-availability-url" content="' + availabilityUrl + '"'));
          NODE
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
